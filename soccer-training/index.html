<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d28">
  <title>San Mateo 双人足球返场训练</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#102d28,#1b6b56);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#fff}.loader{width:min(88vw,420px);text-align:center;padding:32px}.ball{width:58px;height:58px;margin:0 auto 20px;border:6px solid rgba(255,255,255,.22);border-top-color:#d9f47d;border-radius:50%;animation:spin .8s linear infinite}.loader h1{font-size:1.35rem;margin:0 0 10px}.loader p{margin:0;color:rgba(255,255,255,.72);line-height:1.6}.bar{height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-top:22px}.bar span{display:block;height:100%;width:32%;background:#d9f47d;border-radius:inherit;animation:load 1.2s ease-in-out infinite}.error{display:none;background:#fff;color:#14211e;border-radius:18px;padding:20px;text-align:left;line-height:1.55}.error button{border:0;border-radius:12px;background:#102d28;color:#fff;font:inherit;font-weight:700;padding:10px 14px;margin-top:10px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  </style>
</head>
<body>
  <main class="loader" id="loader">
    <div class="ball"></div>
    <h1>正在打开训练计划</h1>
    <p id="status">加载动作、计时器和场地信息…</p>
    <div class="bar"><span></span></div>
    <section class="error" id="error">
      <strong>页面暂时没有加载成功。</strong><br>
      请检查网络后重新尝试。
      <br><button onclick="location.reload()">重新加载</button>
    </section>
  </main>
  <noscript>此训练页面需要启用 JavaScript。</noscript>
  <script>
    const PARTS = [1,2,3,4,5].map(n => `payload-${n}.txt`);

    function base64ToBytes(base64) {
      const binary = atob(base64.replace(/\s/g, ""));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function loadPako() {
      if (window.pako) return;
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js";
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function ungzip(bytes) {
      if ("DecompressionStream" in window) {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return await new Response(stream).text();
      }
      await loadPako();
      return new TextDecoder().decode(window.pako.ungzip(bytes));
    }

    async function boot() {
      const status = document.getElementById("status");
      const chunks = [];
      for (let i = 0; i < PARTS.length; i++) {
        status.textContent = `正在加载训练内容 ${i + 1} / ${PARTS.length}…`;
        const response = await fetch(PARTS[i], {cache: "no-cache"});
        if (!response.ok) throw new Error(`Failed to load ${PARTS[i]}`);
        chunks.push(await response.text());
      }
      status.textContent = "正在准备动作演示…";
      const html = await ungzip(base64ToBytes(chunks.join("")));
      document.open();
      document.write(html);
      document.close();
    }

    boot().catch(error => {
      console.error(error);
      document.querySelector(".ball").style.display = "none";
      document.querySelector(".bar").style.display = "none";
      document.querySelector("#loader > h1").style.display = "none";
      document.getElementById("status").style.display = "none";
      document.getElementById("error").style.display = "block";
    });
  </script>
</body>
</html>
